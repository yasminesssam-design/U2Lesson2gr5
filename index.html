<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة كلمات المرور - منصة محترف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9a8;--bg2:#b8e4ff;--tx:#12305a;--card:#fff;--p:#2f6fd6;--o:#ff9f1c;--g:#22b573;--r:#f0475b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2a5e;--bg2:#12305a;--tx:#fff;--card:#26346b}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Cairo,Tahoma,sans-serif;font-size:21px;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2),#ffd1e8,var(--bg1));background-size:400% 400%;animation:bg 14s ease infinite;min-height:100vh;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl span{position:absolute;bottom:-60px;font-size:34px;opacity:.7;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:820px;margin:auto;padding:14px}
header{text-align:center}header img{width:120px;height:120px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 6px 18px #0003;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{margin:6px 0;font-size:30px;color:var(--p)}h2{margin:4px 0}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 6px 0 #0002;animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:22px;border:0;border-radius:18px;padding:14px;margin:9px 0;color:#fff;background:var(--p);box-shadow:0 5px 0 #0003;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:none}.b1{background:#ef476f}.b2{background:#06a77d}.b3{background:#7b5cf0}.b4{background:var(--o)}
input{font:inherit;width:100%;padding:12px;border-radius:14px;border:3px solid var(--p);text-align:center;font-size:22px}
.k{background:#fff7d6;color:#12305a;border-right:8px solid var(--o);border-radius:14px;padding:10px 14px;margin:8px 0}
.opt{background:#eef4ff;color:#12305a;border:3px solid #c9d9ff}.opt:disabled{opacity:1}
.ok{background:var(--g)!important;color:#fff!important}.no{background:var(--r)!important;color:#fff!important;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.bar{height:14px;background:#0002;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--g));transition:width .4s}
.big{font-size:70px;text-align:center}.fx{position:fixed;font-size:44px;z-index:9;pointer-events:none;animation:fy 1.2s forwards}
@keyframes fy{to{transform:translateY(-200px) scale(1.6);opacity:0}}
.hide{display:none}
</style></head><body>
